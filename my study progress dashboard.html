<!DOCTYPE html>
<html>
    <head>
    <title>my study progress dashboard</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width", initial-scale="1">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
   <style>
    body {background-color:#ffb5ab; font-family:Impact, Haettenschweiler, 'Arial Narrow Bold';}
   .jumbotron{background-color:#ff8878;  border-left:6px solid #f73f31;}
   .jumbotron h1 {color:#f73f31;} 
   .section-title{color:#8a3324; margin-tpo:30px; margin-bottom:15px;}
   p{ font-weight: bold; margin-bottom: 5px;}
   </style>
   </head>
   <body>
    <div class="jumbotron jumbotron-fluid">
        <div class="container">
            <h1>my study  progress dashboard</h1>
            <p class="lead">track your subjects, completed lessons, and learning progress in one place.</p>
            <buton class="btn btn-primary">maths</buton>
            <buton class="btn btn-success">science</buton>
              <buton class="btn btn-danger">English</buton>
            <buton class="btn btn-warning">coding</buton>
        </div>
    </div>
    <div class=" container">
       
   
        
         <h2 class="section-tittle">lesson completed <span class="badge badge-danger">24</span></h2>
            <p>math <span class="badge badge-primary">6 lessons</span></p>
             <p>english <span class="badge badge-info">8 lessons</span> </p>
              <p>coding <span class="badge badge-warning">5 lessons</span></p>
             <p>science <span class="badge badge-success">5 lessons</span></p>
             <h2 class="section tittle">subject progress</h2>
             
             <p>math</p>
             <div class="progress mb-3">
            <div class="progress-br bg-primary" style="width: 80%">80%</div>
             </div>

             <p>english</p>
             <div class="progress mb-3">
            <div class="progress-br bg-danger" style="width: 60%">60%</div>
             </div>

             <p>science</p>
             <div class="progress mb-3">
            <div class="progress-br bg-success" style="width: 50%">50%</div>
             </div>

             <p>coding</p>
             <div class="progress mb-3">
            <div class="progress-br bg-warning" style="width: 50%">50%</div>
             </div>




       
    </div>
   </body>
</html>
